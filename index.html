
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Controle financeiro inteligente e moderno." />
    
    <!-- PWA Settings -->
    <title>Flow Finance</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0b">
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flow Finance">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="mask-icon" href="/favicon.svg" color="#f97316">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0a0a0b',
              surface: '#1c1c1e',
              surfaceLight: '#2c2c2e',
              // Dynamic colors using CSS variables
              accent: 'var(--color-accent)', 
              accentDark: 'var(--color-accent-dark)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default Theme (Orange) */
        --color-accent: #f97316;
        --color-accent-dark: #ea580c;
      }

      /* LOCK MAIN WINDOW SCROLL - CRITICAL FOR SAMSUNG INTERNET */
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden; /* Disables native browser scrollbar */
        background-color: #0a0a0b;
        color: white;
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: none;
        position: fixed; /* Fixes elastic scrolling on iOS/Android */
      }
      
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      /* HIDE SCROLLBARS ON INTERNAL ELEMENTS */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE 10+ */
        /* Disable default touch actions for better gesture control */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Chrome, Safari, Samsung Internet, Edge */
      ::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
        -webkit-appearance: none !important;
      }
      
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        background: transparent !important;
      }

      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb {
        background: transparent !important;
      }
      
      /* Disable text selection for app-like feel */
      .select-none {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  <script type="importmap">

    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "vite": "https://esm.sh/vite@^7.2.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
